version: '3.8'

# ──────────────────────────────────────────────────────────────────
# Local Development / Integration Compose
#
# Runs the API server, the React client (Nginx), MongoDB, and Redis
# as four separate services.
#
# Usage:
#   docker-compose up -d --build
# ──────────────────────────────────────────────────────────────────

services:

  # ── Backend API ────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/taskmanager
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_super_secret_jwt_key_12345}
      - ADMIN_INVITE_TOKEN=${ADMIN_INVITE_TOKEN:-admin_invite_token_123}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  # ── Frontend Client ────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Points the SPA at the API server
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  uploads_data:
