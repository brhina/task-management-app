# render.yaml — Infrastructure-as-code for Render
# Docs: https://render.com/docs/blueprint-spec
#
# Defines both services so Render can auto-configure them from the repo.
# Set secret environment variables (JWT_SECRET, MONGO_URI, etc.) in the
# Render dashboard — do NOT put real secrets in this file.

services:

  # ── 1. Express API — Web Service (Docker) ──────────────────────────
  - type: web
    name: task-manager-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set the following secrets in the Render dashboard:
      # MONGO_URI, REDIS_URL, JWT_SECRET, ADMIN_INVITE_TOKEN, CLIENT_URL
      # SERVER_PUBLIC_URL — public API URL (e.g. https://task-manager-server.onrender.com)
      # Used for profile image URLs and Telebirr callbacks; must NOT be the client URL.
    healthCheckPath: /health

  # ── 2. React SPA — Static Site ─────────────────────────────────────
  - type: web
    name: task-manager-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    region: oregon
    plan: free
    routes:
      # SPA fallback — all paths serve index.html so React Router works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set VITE_API_BASE_URL to your server's Render URL in the dashboard,
      # e.g. https://task-manager-server.onrender.com
      # It is baked into the JS bundle at build time by Vite.
      - key: VITE_API_BASE_URL
        sync: false
